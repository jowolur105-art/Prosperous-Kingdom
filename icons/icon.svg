<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0926B"/>
      <stop offset="100%" stop-color="#7A6B4A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Distant hills -->
  <ellipse cx="140" cy="340" rx="160" ry="50" fill="#0D6B63" opacity="0.4"/>
  <ellipse cx="400" cy="350" rx="140" ry="40" fill="#0D6B63" opacity="0.3"/>

  <!-- Road -->
  <path d="M100 420 Q256 380 412 420 L440 512 L72 512 Z" fill="url(#road)" opacity="0.85"/>
  <rect x="244" y="430" width="24" height="12" rx="3" fill="#FFF" opacity="0.5"/>
  <rect x="244" y="460" width="24" height="12" rx="3" fill="#FFF" opacity="0.4"/>
  <rect x="244" y="490" width="24" height="12" rx="3" fill="#FFF" opacity="0.3"/>

  <!-- Walking figure -->
  <g transform="translate(240, 260)" fill="#FFF">
    <!-- Head -->
    <circle cx="0" cy="-58" r="26"/>
    <!-- Body -->
    <line x1="0" y1="-32" x2="0" y2="28" stroke="#FFF" stroke-width="13" stroke-linecap="round"/>
    <!-- Left arm (back) -->
    <line x1="-4" y1="-22" x2="-32" y2="12" stroke="#FFF" stroke-width="10" stroke-linecap="round"/>
    <!-- Right arm (forward) -->
    <line x1="4" y1="-22" x2="28" y2="-6" stroke="#FFF" stroke-width="10" stroke-linecap="round"/>
    <!-- Left leg (forward stride) -->
    <line x1="-2" y1="24" x2="-28" y2="76" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>
    <!-- Right leg (back stride) -->
    <line x1="2" y1="24" x2="24" y2="72" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Coin -->
  <circle cx="348" cy="178" r="28" fill="#F59E0B"/>
  <circle cx="348" cy="178" r="20" fill="none" stroke="#FCD34D" stroke-width="2.5"/>
  <text x="348" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#FFF">$</text>

  <!-- Small clouds -->
  <ellipse cx="100" cy="100" rx="40" ry="18" fill="#FFF" opacity="0.3"/>
  <ellipse cx="380" cy="80" rx="50" ry="20" fill="#FFF" opacity="0.25"/>
</svg>
